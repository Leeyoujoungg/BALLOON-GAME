<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BALLOON</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="title">
    <h1>BALLOON</h1>
    <div class="help" tabindex="0" aria-label="게임 설명">
      <span class="help-icon">?</span>
      <p class="help-box">
        START를 누르고 마이크를 허용한 뒤, 적당한 세기로 "후~" 불면 에어 댄서가 점점 일어섭니다.
        약하면 바람이 빠지고, 너무 세게 불면 터집니다. 100%를 채우면 성공!
        한 번도 너무 세게 불지 않으면 PERFECT!
      </p>
    </div>
  </header>

  <!-- 제목 아래: 풍선 크기 -->
  <div class="size" id="size">0%</div>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>

    <!-- 풍선 아래: 입김 세기 게이지 + 위험 게이지 -->
    <div class="meters hidden" id="meters">
      <div class="meter-row">
        <span class="m-label" id="micIcon">🎤</span>
        <div class="gauge">
          <div class="zone z-weak" id="zWeak"></div>
          <div class="zone z-ok" id="zOk"></div>
          <div class="zone z-hot" id="zHot"></div>
          <div class="g-fill" id="gFill"></div>
        </div>
      </div>
      <div class="meter-row">
        <span class="m-label">⚠️</span>
        <div class="danger-bar"><div id="dangerFill"></div></div>
      </div>
    </div>

    <!-- START / 결과 화면 -->
    <div class="overlay" id="overlay">
      <div class="card hidden" id="card">
        <div class="grade" id="grade"></div>
        <div class="card-sub" id="cardSub"></div>
      </div>
      <button id="startBtn">START</button>
    </div>
  </div>

  <!-- 하단: 평소엔 한 줄 설명, 게임 중엔 현재 상태 안내 -->
  <p class="guide" id="status">🎤 마이크에 "후~" 불어서 풍선을 100%까지 키우세요</p>
</div>

<script src="game.js"></script>
</body>
</html>
